services:
  db:
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_DB=crmapp
      - POSTGRES_PASSWORD=strongPassword
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data

  crm:
    build: .
    depends_on:
      - db
    ports:
      - "8080:80"

volumes:
  db:
    driver: local
